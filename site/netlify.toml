[build]
  publish = "dist"
  command = "npm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The booking app (ADR 0005): its API and its login page are served under this domain, so the session cookie is
# first-party. The address is not decided. APP_ORIGIN_TODO.invalid never resolves, so a deploy before it is set
# returns 502 on these paths instead of a wrong page. Replace it everywhere in this block, then LAUNCH=1 passes
# tests/netlify-proxy.test.mjs.
[[redirects]]
  from = "/api/*"
  to = "https://APP_ORIGIN_TODO.invalid/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/prijava"
  to = "https://APP_ORIGIN_TODO.invalid/prijava"
  status = 200
  force = true
[[redirects]]
  from = "/en/prijava"
  to = "https://APP_ORIGIN_TODO.invalid/en/prijava"
  status = 200
  force = true
[[redirects]]
  from = "/prijava-logo.svg"
  to = "https://APP_ORIGIN_TODO.invalid/prijava-logo.svg"
  status = 200
  force = true
